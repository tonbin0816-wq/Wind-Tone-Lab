<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover: ノッチ/ホームバー領域まで使い、env(safe-area-inset-*)を有効化する -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 地の色と必ず一致させる(--c-bg)。ここだけ旧地 #F6F7F9 のままだと、
         iPhone Safari / PWA でブラウザ・ステータスバーの帯だけが灰色に残る。 -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- ホーム画面から全画面(ブラウザのURLバー等なし)で起動する設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ficus" />
    <!-- 音名の主役書体(Instrument Serif)。以前は App.jsx 内 <style> の @import で読み込んでいたが、
         それだと JS バンドル評価後に取得が始まり、初回表示で音名が一瞬別書体になる(FOUT)。
         ここ(HTML)に置くと HTML パース時点で取得が始まり、最初の描画に間に合いやすい(F-43)。
         数字・英字はシステムフォント(SF Pro)なのでネットワーク取得はこの1書体だけ。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <title>Ficus - サックス練習支援アプリ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
