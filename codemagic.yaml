# Ficus の iOS の殻(Capacitor 8・SPM)。手で開始する(無料枠 500 分/月)。タグ ios-v* の push でも動く。
# 秘密(API キー・.p8・証明書)はこのファイルに書かない。Codemagic の Team integrations / Code signing identities / Environment variables に本人が入れる。
workflows:
  ios-testflight:
    name: Ficus iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ficus-asc          # §7-B で付けた API キーの名前
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.tobine.ficus
      groups:
        - ficus_firebase                    # VITE_FIREBASE_API_KEY / AUTH_DOMAIN / PROJECT_ID / APP_ID(§7-D)
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 26.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-v*'
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Capacitor sync (copies dist into ios/App/App/public, updates CapApp-SPM)
        script: npx cap sync ios
      - name: Set build number
        # 【殻 S2】$PROJECT_BUILD_NUMBER = この Codemagic のアプリの全 workflow を通した通し番号。開発版(ios-dev)と
        # 同じ App Store Connect の枠へ上げるので、workflow ごとの $BUILD_NUMBER だと番号がぶつかって上げられない。
        # 通し番号は workflow ごとの番号以上なので、これまでに上げた番号より必ず大きい。
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # 【便BW 統括の裁定 2026-10-06】submit_to_testflight は「TestFlight の外部テストの審査(beta review)へ申し込む」設定。
      # App Store Connect へ上げることそのものは、この publishing があれば行われる。内部テスター(本人)には審査なしで届く ──
      # ただし App Store Connect の内部グループで「自動配信」が有効なときに限る。今は有効(グループ「内部」を作ったとき、有効のまま作成した)。
      # 前のビルドが審査中だと申し込めずに「失敗」になっていたので、3つとも申し込まない。App Store の審査への提出は本人が
      # App Store Connect で版の情報を確かめてから行う(submit_to_app_store は false のまま。ios-release はそのためのビルドを作る)。
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # 【殻 S2 統括の裁定】開発版。中身は ios-testflight と同じで、違いは4つだけ:
  #   (1) cap sync の後で、生成物 ios/App/App/capacitor.config.json に server.url(Vercel の配信)を足す
  #       (scripts/shell-dev-server-url.mjs。根の capacitor.config.json は変えない)
  #   (2) ホーム画面の名前を「Ficus Dev」に、TestFlight の「テストの内容(What to Test)」に開発版と書く(release_notes.txt)
  #   (3) 【便S4】広告は試験のまま: Info.plist の GADApplicationIdentifier を Google の sample に書き戻す
  #       (scripts/shell-ads-ids.mjs dev。値は src/shell/adsConfig.js の ADMOB_DEV_APP_ID_IOS)。バナーのユニットは、
  #       JS が「server.url で読んでいる = 開発版」と見て試験の ID を選ぶ(src/shell/native.js の shellBuildKind)。
  #       本人が毎日触るので、本物の広告を誤って押すと AdMob の無効なトラフィックになる。
  #   (4) 版を 99.0 にする(agvtool new-marketing-version。本番の 1.x の並びと審査の提出の候補に混ざらない)
  # main へ push すれば、開発版のアプリを開き直すだけで画面の変更が届く。ネイティブの変更(Swift・Info.plist・
  # プラグインの追加)はこの workflow の再ビルドが要る。手でだけ開始する(triggering を書かない)。
  # **審査には出さない**(server.url は審査の 4.2 の論点そのもの。本番の ios-testflight には入れない。pitch-test K.15 が見張る)。
  ios-dev:
    name: Ficus iOS DEV (TestFlight, loads the Vercel deployment)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ficus-asc          # §7-B で付けた API キーの名前
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.tobine.ficus
      groups:
        - ficus_firebase                    # 同梱の dist は使わないが、ビルドを本番と同じ手順に保つ
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 26.2
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Capacitor sync (copies dist into ios/App/App/public, updates CapApp-SPM)
        script: npx cap sync ios
      - name: Dev shell - load the Vercel deployment (server.url in the generated ios/App/App/capacitor.config.json only)
        script: node scripts/shell-dev-server-url.mjs
      - name: Dev shell - home screen name and What to Test
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Ficus Dev'" ios/App/App/Info.plist
          printf '%s\n' "開発版(Web の配信 https://wind-tone-lab.vercel.app を読み込む)。main への push はアプリを開き直すだけで反映。審査に出さない。" "commit: $(git rev-parse --short HEAD)" > release_notes.txt
          cat release_notes.txt
      - name: Dev shell - test ads (GADApplicationIdentifier back to the Google sample)
        script: node scripts/shell-ads-ids.mjs dev
      - name: Set build number and the dev version line (99.0)
        # 【殻 S2 審査】開発版は版 99.0 の並びに分ける(本番の 1.x の並びと、審査の提出の候補に混ざらない)。
        # 99 にするのは、1.0 が承認されたあとはそれより低い版を上げられないため。本番(ios-testflight)は版を変えない。
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
          agvtool new-marketing-version 99.0
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # 【便BW 統括の裁定 2026-10-06】submit_to_testflight は「TestFlight の外部テストの審査(beta review)へ申し込む」設定。
      # App Store Connect へ上げることそのものは、この publishing があれば行われる。内部テスター(本人)には審査なしで届く ──
      # ただし App Store Connect の内部グループで「自動配信」が有効なときに限る。今は有効(グループ「内部」を作ったとき、有効のまま作成した)。
      # 前のビルドが審査中だと申し込めずに「失敗」になっていたので、3つとも申し込まない。App Store の審査への提出は本人が
      # App Store Connect で版の情報を確かめてから行う(submit_to_app_store は false のまま。ios-release はそのためのビルドを作る)。
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  # 【殻 S3 統括の裁定】審査に出す専用。中身は ios-testflight と同じで、違いは2つだけ:
  #   (1) ビルドの前の1段: 本番の広告 ID が揃っていなければ exit 1(【便S4】scripts/shell-ads-ids.mjs release)
  #   (2) 手でだけ開始する(triggering を書かない。タグの push では走らない)
  # **審査に出すビルドはこの workflow で作る。**
  # 【便S4 2026-10-25】git の中の値は本番の ID になった。同梱の資産を読む ios-testflight もこの workflow も本物の広告を出す
  # (押さない)。開発版の ios-dev だけが試験の広告(上の ios-dev の (3))。
  # pitch-test K.23 が「ios-testflight との差はこの2つだけ」を見張る。
  ios-release:
    name: Ficus iOS RELEASE (for App Review)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ficus-asc          # §7-B で付けた API キーの名前
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.tobine.ficus
      groups:
        - ficus_firebase                    # VITE_FIREBASE_API_KEY / AUTH_DOMAIN / PROJECT_ID / APP_ID(§7-D)
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: 26.2
    scripts:
      - name: Refuse the demo ad IDs (release only)
        # 【殻 S3 統括の裁定 → 便S4】審査に出すビルドの本番の広告 ID を確かめ、揃っていなければ止める。
        # 見るのは値の唯一の答えの2か所(src/shell/adsConfig.js の本番の値と JS の選び方・ios/App/App/Info.plist のアプリ ID)。
        # 【便S4】adsConfig.js は開発版のための試験の ID も持つようになったので、ファイルを丸ごと grep する門はやめた。
        # npm ci より前に走る(node の組み込みと adsConfig.js だけを読む)。
        script: node scripts/shell-ads-ids.mjs release
      - name: Install npm dependencies
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Capacitor sync (copies dist into ios/App/App/public, updates CapApp-SPM)
        script: npx cap sync ios
      - name: Set build number
        # 【殻 S2】$PROJECT_BUILD_NUMBER = この Codemagic のアプリの全 workflow を通した通し番号。開発版(ios-dev)と
        # 同じ App Store Connect の枠へ上げるので、workflow ごとの $BUILD_NUMBER だと番号がぶつかって上げられない。
        # 通し番号は workflow ごとの番号以上なので、これまでに上げた番号より必ず大きい。
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      # 【便BW 統括の裁定 2026-10-06】submit_to_testflight は「TestFlight の外部テストの審査(beta review)へ申し込む」設定。
      # App Store Connect へ上げることそのものは、この publishing があれば行われる。内部テスター(本人)には審査なしで届く ──
      # ただし App Store Connect の内部グループで「自動配信」が有効なときに限る。今は有効(グループ「内部」を作ったとき、有効のまま作成した)。
      # 前のビルドが審査中だと申し込めずに「失敗」になっていたので、3つとも申し込まない。App Store の審査への提出は本人が
      # App Store Connect で版の情報を確かめてから行う(submit_to_app_store は false のまま。ios-release はそのためのビルドを作る)。
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
