<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --font-jp: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
      --font-num: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-serif: "Instrument Serif", serif;
      --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px;
      --fs-2xl: 28px; --fs-hero: 46px;
      --r-1: 8px; --r-2: 12px; --r-full: 999px;
      --r-xs: var(--r-1); --r-sm: var(--r-1); --r-md: var(--r-2); --r-lg: var(--r-2); --r-pill: var(--r-full);
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
      --sp-6: var(--sp-5); --sp-8: var(--sp-5);
      --d-fast: 120ms; --d-base: 200ms; --d-slow: 320ms;
      --lh-tight: 1.3; --lh-base: 1.6; --lh-loose: 1.75;
      --tap-min: 44px;
      --c-bg: #FFFFFF; --c-surface: #FFFFFF; --c-sunk: #F6F7F9; --c-sunken: #EEF1F4;
      --c-rule: #E1E6EC;
      --c-ink: #121F32; --c-ink-2: #435266; --c-ink-3: #8D95A1; --c-ink-4: #A6AEBA;
      --c-line: #E9ECF0; --c-line-strong: #C3CAD3;
      --c-accent: #174585; --c-accent-mid: #7FA0CE; --c-accent-dim: #9DB3CC;
      --c-accent-line: #B9C9E4; --c-accent-tint: #EAEFF5;
      --c-on-accent: #FFFFFF; --c-on-accent-dim: #B9C9E4;
      --c-rank-1: #B08A2E; --c-rank-2: #77808B; --c-rank-3: #9A5330; --c-rank-1-base: #896C24;
      --c-avatar-1: #174585; --c-avatar-2: #3E6E8E; --c-avatar-3: #2F6F5E;
      --c-avatar-4: #6B7A3F; --c-avatar-5: #9A6B2F; --c-avatar-6: #A8543C;
      --c-avatar-7: #7D4A6B; --c-avatar-8: #5B5FA3; --c-avatar-9: #4A5567;
      --c-avatar-10: #2C3542;
      --c-disabled: #B7BFC9; --c-danger: #DC2626;
      --c-good: #16A34A; --c-warn: #D97706; --c-bad: #DC2626; --c-warn-bg: #FDF0E1;
      --c-div-1: #43719F; --c-div-2: #658BB1; --c-div-3: #89A6C3; --c-div-4: #B3C6D9;
      --c-div-5: #E2D0A3; --c-div-6: #D1B570; --c-div-7: #C39F45; --c-div-8: #B5891C;
      --c-quiet: #C7CFD9;
      --shadow-card: 0 1px 2px rgba(18, 31, 50, .04), 0 6px 16px rgba(18, 31, 50, .06);
      --shadow-row: 0 1px 2px rgba(18, 31, 50, .04), 0 6px 16px rgba(18, 31, 50, .06);
      --shadow-seg: 0 1px 2px rgba(18, 31, 50, .08), 0 2px 6px rgba(18, 31, 50, .06);
      --c-coach-dim: rgba(18, 31, 50, .46);
      --nav-h: 47px;
      --ad-h: 0px;
      --page-bottom-gap: calc(var(--nav-h) + var(--ad-h) + env(safe-area-inset-bottom));
      --page-side-pad: 14px;
      --page-pad-left: calc(var(--page-side-pad) + env(safe-area-inset-left));
      --page-pad-right: calc(var(--page-side-pad) + env(safe-area-inset-right));
      --page-max-w: 640px;
      --pane-max-w: 1000px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; background: var(--c-bg); font-family: var(--font-jp); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    a { color: var(--c-accent); } a:hover { color: #123A70; }
  </style>
</helmet>
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <symbol id="ic-cat" viewBox="0 0 256 256"><path d="M222.83,33.54a16,16,0,0,0-18.14,3.15c-.14.14-.26.27-.38.41L187.05,57A111.28,111.28,0,0,0,69,57L51.69,37.1c-.12-.14-.24-.27-.38-.41a16,16,0,0,0-18.14-3.15A16.4,16.4,0,0,0,24,48.46V136c0,49,40.06,89.63,91.56,95.32a4,4,0,0,0,4.44-4v-32l-13.42-13.43a8.22,8.22,0,0,1-.41-11.37,8,8,0,0,1,11.49-.18L128,180.68l10.34-10.35a8,8,0,0,1,11.49.18,8.22,8.22,0,0,1-.41,11.37L136,195.31v32a4,4,0,0,0,4.44,4C191.94,225.62,232,185,232,136V48.46A16.4,16.4,0,0,0,222.83,33.54ZM84,152a12,12,0,1,1,12-12A12,12,0,0,1,84,152Zm20-64a8,8,0,1,1-16,0V69a8,8,0,0,1,16,0Zm32,0a8,8,0,1,1-16,0V64a8,8,0,0,1,16,0Zm16,0V69a8,8,0,0,1,16,0V88a8,8,0,1,1-16,0Zm20,64a12,12,0,1,1,12-12A12,12,0,0,1,172,152Z"/></symbol>
    </defs>
  </svg>
  <div style="width: 375px; background: var(--c-bg); padding: 0 14px; box-sizing: border-box">
    <div style="padding: 0 var(--sp-4) var(--sp-6); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4)">
      <div style="display: flex; align-items: center; gap: var(--sp-3)">
        <span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; background: var(--c-avatar-1)"><svg width="33.6" height="33.6" fill="#fff" aria-hidden="true"><use href="#ic-cat" /></svg></span>
        <div style="min-width: 0; flex: 1 1 0">
          <div style="font-size: var(--fs-md); font-weight: 700; color: var(--c-ink)">しろねこ</div>
          <!-- 【便AV 2026-09-24 本人指示】人物紹介はアイコンと名前だけ(属性・歴・ジャンルはプロフィールのタブと重複) -->
        </div>
      </div>

      <div style="display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--c-sunken); border-radius: var(--r-2); padding: 0 2px; min-height: 44px">
        <span style="display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 44px; padding: 0 2px">
          <span style="display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; min-height: 36px; padding: 0 4px; box-sizing: border-box; border-radius: var(--r-1); white-space: nowrap; overflow: hidden; font-size: var(--fs-md); font-weight: 600; color: var(--c-ink-3); background: transparent; box-shadow: none">データ</span>
        </span>
        <span style="display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 44px; padding: 0 2px">
          <span style="display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; min-height: 36px; padding: 0 4px; box-sizing: border-box; border-radius: var(--r-1); white-space: nowrap; overflow: hidden; font-size: var(--fs-md); font-weight: 700; color: var(--c-ink); background: var(--c-surface); box-shadow: var(--shadow-seg)">プロフィール</span>
        </span>
      </div>

      <div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">属性</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0">学生</div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">演奏開始年</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0"><span style="font-family: var(--font-num)">2023</span>年</div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">ジャンル</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0"><span style="display: flex; flex-wrap: wrap; gap: 9px"><span>クラシック</span><span>ポップス</span></span></div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">編成</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0"><span style="display: flex; flex-wrap: wrap; gap: 9px"><span>吹奏楽</span></span></div>
        </div>
      </div>

      <!-- 【便AV 2026-09-24 本人指示】「楽器の組」の見出しは消した。楽器の行が見出しの役をする -->
      <div style="display: flex; gap: var(--sp-1)">
        <span style="min-height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0">
          <span style="display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 13px; border-radius: var(--r-pill); border: 1px solid transparent; color: var(--c-line-strong); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; width: 100%; box-sizing: border-box">S.Sax</span>
        </span>
        <span style="min-height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0">
          <span style="display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 13px; border-radius: var(--r-pill); border: 1px solid var(--c-accent); color: var(--c-accent); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; width: 100%; box-sizing: border-box">A.Sax</span>
        </span>
        <span style="min-height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0">
          <span style="display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 13px; border-radius: var(--r-pill); border: 1px solid var(--c-line-strong); color: var(--c-ink-2); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; width: 100%; box-sizing: border-box">T.Sax</span>
        </span>
        <span style="min-height: 44px; display: inline-flex; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0">
          <span style="display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 0 13px; border-radius: var(--r-pill); border: 1px solid transparent; color: var(--c-line-strong); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; width: 100%; box-sizing: border-box">B.Sax</span>
        </span>
      </div>
      <div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">楽器</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0">YAMAHA YAS-62</div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">マウスピース</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0">Selmer Paris S90 180</div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: 1px solid var(--c-line)">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">リガチャー</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0">YAMAHA 標準</div>
        </div>
        <div style="display: flex; gap: var(--sp-3); align-items: baseline; padding: var(--sp-2) 0; border-bottom: none">
          <div style="font-size: var(--fs-xs); color: var(--c-ink-2); font-weight: 600; flex: 0 0 7em">リード</div>
          <div style="font-size: var(--fs-sm); color: var(--c-ink); line-height: 1.7; flex: 1 1 0; min-width: 0">Vandoren Traditional <span style="font-family: var(--font-num)">2.5</span></div>
        </div>
      </div>

      <!-- 【便BF 2026-10-01 便BE の写し + 統括の指示】本文の末尾に、ブロック(上)と通報(下)の入口。
           2つの間は --sp-2、上に --sp-6、どちらも本文の幅いっぱい・当たり 44・角 --r-pill・字 --fs-sm 700。
           ブロックは地なし・枠 1px --c-line-strong・字 --c-ink-2(QUIET_OUTLINE_STYLE)、
           通報は地なし・枠と字が --c-danger(DANGER_OUTLINE_STYLE)。
           **文字は統括の指示で「ブロック」「通報」**(2026-10-01。実装の「この人をブロック」「この人を通報」は
           別の便で直る)。押した先の確認のシート・通報のシートは別の便で作り直すので、正典には描かない。 -->
      <div style="margin-top: var(--sp-6); display: grid; gap: var(--sp-2)">
        <div style="width: 100%; min-height: 44px; border-radius: var(--r-pill); border: 1px solid var(--c-line-strong); background: transparent; color: var(--c-ink-2); font-size: var(--fs-sm); font-weight: 700; padding: 0 var(--sp-4); box-sizing: border-box; display: flex; align-items: center; justify-content: center">ブロック</div>
        <div style="width: 100%; min-height: 44px; border-radius: var(--r-pill); border: 1px solid var(--c-danger); background: transparent; color: var(--c-danger); font-size: var(--fs-sm); font-weight: 700; padding: 0 var(--sp-4); box-sizing: border-box; display: flex; align-items: center; justify-content: center">通報</div>
      </div>
    </div>
  </div>
</x-dc>
</body>
</html>
