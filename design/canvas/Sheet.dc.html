<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --font-jp: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
      --font-num: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px;
      --r-xs: 4px; --r-sm: 8px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --tap-min: 44px;
      --c-bg: #FFFFFF; --c-surface: #FFFFFF; --c-sunk: #F6F7F9;
      --c-rule: #E1E6EC; --c-ink: #121F32; --c-ink-2: #435266; --c-ink-3: #8D95A1;
      --c-line: #E9ECF0; --c-line-strong: #C3CAD3;
      --c-accent: #174585; --c-accent-mid: #7FA0CE; --c-accent-line: #B9C9E4;
      --c-on-accent: #FFFFFF;
      --c-div-1: #43719F; --c-div-2: #658BB1; --c-div-3: #89A6C3; --c-div-4: #B3C6D9;
      --c-div-5: #E2D0A3; --c-div-6: #D1B570; --c-div-7: #C39F45; --c-div-8: #B5891C;
      --c-quiet: #C7CFD9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; background: var(--c-bg); font-family: var(--font-jp); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    a { color: var(--c-accent); } a:hover { color: #123A70; }
  </style>
</helmet>
<div style="width: 375px; background: var(--c-bg); padding: 16px 14px; box-sizing: border-box">
      <div style="font-size: 15px; font-weight: 600; color: var(--c-ink); margin-bottom: 4px">系列を選ぶ ─ 左右で同じものは選べない</div>
      <div style="font-size: 11px; color: var(--c-ink-3); margin-bottom: 16px; line-height: 1.5">本人指示「一方で選ばれているものはそもそももう一方の選択肢から削除するように」。<br>押せない選択肢を出さない（F-77 と同じ手）。</div>
      <div style="display: flex; align-items: center; gap: 8px; height: 35px; margin-bottom: 14px">
        <div style="display: inline-flex; align-items: center; height: 20px; padding: 0 13px; font-size: 12px; font-weight: 600; background: transparent; border: 1px solid var(--c-accent); border-radius: 8px; color: var(--c-ink-2)">8/24</div>
        <span style="font-size: 16px; line-height: 1; color: var(--c-ink-3)">×</span>
        <div style="display: inline-flex; align-items: center; height: 20px; padding: 0 13px; font-size: 12px; font-weight: 600; background: transparent; border: 1px solid var(--c-accent-mid); border-radius: 8px; color: var(--c-ink-2)">my平均</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div>
          <div style="font-size: 11px; color: var(--c-ink-3); margin-bottom: 6px">左（8/24）を押したとき ─ <b style="color: var(--c-ink)">my平均が消える</b></div>
          <div style="border: 1px solid var(--c-line-strong); border-radius: 16px; padding: 12px; background: var(--c-surface)">
          <div style="font-size: 12px; font-weight: 600; color: var(--c-ink-3); padding: 0 2px 8px">1本目</div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: var(--c-accent-tint); color: var(--c-accent); border-radius: 8px">8/24（その日）<span style="margin-left: auto; font-size: 13px">✓</span></div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: transparent; color: var(--c-ink-4); text-decoration: line-through; border-radius: 8px">my平均</div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: transparent; color: var(--c-ink); border-radius: 8px">目安</div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: transparent; color: var(--c-ink); border-radius: 8px">±0</div>
        </div>
        </div>
        <div>
          <div style="font-size: 11px; color: var(--c-ink-3); margin-bottom: 6px">右（my平均）を押したとき ─ <b style="color: var(--c-ink)">8/24 が消える</b></div>
          <div style="border: 1px solid var(--c-line-strong); border-radius: 16px; padding: 12px; background: var(--c-surface)">
          <div style="font-size: 12px; font-weight: 600; color: var(--c-ink-3); padding: 0 2px 8px">2本目</div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: transparent; color: var(--c-ink-4); text-decoration: line-through; border-radius: 8px">8/24（その日）</div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: var(--c-accent-tint); color: var(--c-accent); border-radius: 8px">my平均<span style="margin-left: auto; font-size: 13px">✓</span></div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: transparent; color: var(--c-ink); border-radius: 8px">目安</div>
            <div style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; background: transparent; color: var(--c-ink); border-radius: 8px">±0</div>
        </div>
        </div>
      </div>
      <div style="margin-top: 16px; padding: 10px 12px; background: var(--c-sunk); border-radius: 8px; font-size: 11px; color: var(--c-ink-2); line-height: 1.6">
        取り消し線は<b>説明のための印</b>で、実装では<b>行ごと出さない</b>。<br>
        「±0」は平均差分のときだけ出る（既存の <span style="font-family: var(--font-num)">pitchOnly</span> の規則）。<br>
        目安が未設定なら「目安」も出ない（既存の規則）。
      </div>
    </div>
</x-dc>
</body>
</html>
