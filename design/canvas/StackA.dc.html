<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --font-jp: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
      --font-num: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px;
      --r-xs: 4px; --r-sm: 8px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --tap-min: 44px;
      --c-bg: #FFFFFF; --c-surface: #FFFFFF; --c-sunk: #F6F7F9;
      --c-rule: #E1E6EC; --c-ink: #121F32; --c-ink-2: #435266; --c-ink-3: #8D95A1;
      --c-line: #E9ECF0; --c-line-strong: #C3CAD3;
      --c-accent: #174585; --c-accent-mid: #7FA0CE; --c-accent-line: #B9C9E4;
      --c-on-accent: #FFFFFF;
      --c-div-1: #43719F; --c-div-2: #658BB1; --c-div-3: #89A6C3; --c-div-4: #B3C6D9;
      --c-div-5: #E2D0A3; --c-div-6: #D1B570; --c-div-7: #C39F45; --c-div-8: #B5891C;
      --c-quiet: #C7CFD9;
      /* 【2026/08/26】モックの中で var() は書かれていたのに**未定義だった**4つを足した。
         未定義のカスタムプロパティは transparent 扱いになるので、カレンダーの
         薄い段(--c-accent-tint)が消えていた。値は src/index.css から写している。 */
      --fs-2xl: 28px; --fs-hero: 46px;
      --c-ink-4: #A6AEBA; --c-accent-tint: #EAEFF5; --c-danger: #DC2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; background: var(--c-bg); font-family: var(--font-jp); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    a { color: var(--c-accent); } a:hover { color: #123A70; }
  </style>
</helmet>
<div style="width: 420px; background: var(--c-bg); padding: 16px 14px; box-sizing: border-box">
      <div style="font-size: 15px; font-weight: 600; color: var(--c-ink); margin-bottom: 4px">案A ─ 比較対象の行を畳む</div>
      <div style="font-size: 11px; color: var(--c-ink-3); margin-bottom: 16px; line-height: 1.5">375x812 の実測。実効ビューポートは 812 − ナビ47 − セーフエリア34 = <span style="font-family: var(--font-num)">731px</span>。<br>ブロックの高さは実寸。</div>
      <div style="display: flex; gap: 16px; align-items: flex-start">
        <div style="width: 176px; flex-shrink: 0">
          <div style="font-size: 12px; font-weight: 600; color: var(--c-ink); margin-bottom: 8px">現状</div>
          <div style="display: flex; flex-direction: column; gap: 2px">
<div style="height: 48px; background: var(--c-sunk); color: var(--c-ink-2); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>子タブ</span><span style="font-family: var(--font-num); opacity: .75">48</span></div>
<div style="height: 16px; background: var(--c-line); color: var(--c-ink-3); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>カードの上余白</span><span style="font-family: var(--font-num); opacity: .75">16</span></div>
<div style="height: 45px; background: var(--c-sunk); color: var(--c-ink-2); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>指標タブ</span><span style="font-family: var(--font-num); opacity: .75">45</span></div>
<div style="height: 52px; background: #FDE8E8; color: #9B2C2C; border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>比較対象 + 切替</span><span style="font-family: var(--font-num); opacity: .75">52</span></div>
<div style="height: 19px; background: var(--c-line); color: var(--c-ink-3); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>凡例</span><span style="font-family: var(--font-num); opacity: .75">19</span></div>
          </div>
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--c-rule); font-size: 11px; color: var(--c-ink-3)">グラフの上端 <span style="font-family: var(--font-num); font-size: 13px; font-weight: 600; color: var(--c-ink)">y = 180</span></div>
        </div>
        <div style="width: 176px; flex-shrink: 0">
          <div style="font-size: 12px; font-weight: 600; color: var(--c-ink); margin-bottom: 8px">案A</div>
          <div style="display: flex; flex-direction: column; gap: 2px">
<div style="height: 48px; background: var(--c-sunk); color: var(--c-ink-2); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>子タブ</span><span style="font-family: var(--font-num); opacity: .75">48</span></div>
<div style="height: 16px; background: var(--c-line); color: var(--c-ink-3); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>カードの上余白</span><span style="font-family: var(--font-num); opacity: .75">16</span></div>
<div style="height: 45px; background: var(--c-accent-tint); color: var(--c-accent); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>指標タブ + 比較対象</span><span style="font-family: var(--font-num); opacity: .75">45</span></div>
<div style="height: 19px; background: var(--c-line); color: var(--c-ink-3); border-radius: 4px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; font-weight: 600"><span>凡例</span><span style="font-family: var(--font-num); opacity: .75">19</span></div>
          </div>
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--c-rule); font-size: 11px; color: var(--c-ink-3)">グラフの上端 <span style="font-family: var(--font-num); font-size: 13px; font-weight: 600; color: var(--c-ink)">y = 128</span></div>
        </div>
      </div>
      <div style="margin-top: 16px; padding: 10px 12px; background: var(--c-sunk); border-radius: 8px; font-size: 11px; color: var(--c-ink-2); line-height: 1.6">
        <span style="font-weight: 600; color: var(--c-ink)">−52px（実効ビューポートの 7%）。</span>データに触る前の割合は <span style="font-family: var(--font-num)">25% → 18%</span>。<br>
        44pt はチップの床なので、行を減らす以外に削る余地はもう無い。
      </div>
    </div>
</x-dc>
</body>
</html>
