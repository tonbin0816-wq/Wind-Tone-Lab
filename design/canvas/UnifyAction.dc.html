<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --font-jp: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
      --font-num: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px;
      --fs-2xl: 28px; --fs-hero: 46px;
      --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;
      --tap-min: 44px;
      --c-bg: #FFFFFF; --c-surface: #FFFFFF; --c-sunk: #F6F7F9; --c-sunken: #EEF1F4;
      --c-rule: #E1E6EC;
      --c-ink: #121F32; --c-ink-2: #435266; --c-ink-3: #8D95A1; --c-ink-4: #A6AEBA;
      --c-line: #E9ECF0; --c-line-strong: #C3CAD3;
      --c-accent: #174585; --c-accent-mid: #7FA0CE; --c-accent-dim: #9DB3CC;
      --c-accent-line: #B9C9E4; --c-accent-tint: #EAEFF5;
      --c-on-accent: #FFFFFF; --c-on-accent-dim: #B9C9E4;
      --c-rank-1: #C79A3E; --c-rank-2: #9BA6B4; --c-rank-3: #A9743E;
      --c-avatar-1: #174585; --c-avatar-2: #3E6E8E; --c-avatar-3: #2F6F5E;
      --c-avatar-4: #6B7A3F; --c-avatar-5: #9A6B2F; --c-avatar-6: #A8543C;
      --c-avatar-7: #7D4A6B; --c-avatar-8: #5B5FA3; --c-avatar-9: #4A5567;
      --c-avatar-10: #2C3542;
      --c-disabled: #B7BFC9; --c-danger: #DC2626;
      --c-good: #16A34A; --c-warn: #D97706; --c-bad: #DC2626;
      --c-div-1: #43719F; --c-div-2: #658BB1; --c-div-3: #89A6C3; --c-div-4: #B3C6D9;
      --c-div-5: #E2D0A3; --c-div-6: #D1B570; --c-div-7: #C39F45; --c-div-8: #B5891C;
      --c-quiet: #C7CFD9;
      --shadow-card: 0 1px 2px rgba(18, 31, 50, .04), 0 6px 16px rgba(18, 31, 50, .06);
      --shadow-row: 0 1px 2px rgba(18, 31, 50, .04), 0 6px 16px rgba(18, 31, 50, .06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { margin: 0; background: var(--c-bg); font-family: var(--font-jp); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
    a { color: var(--c-accent); } a:hover { color: #123A70; }
  </style>
</helmet>
<div style="width: 375px; background: var(--c-bg); padding: 14px; box-sizing: border-box">
      <div style="font-size: var(--fs-md); font-weight: 700; color: var(--c-ink)">D7 「この画面の主要動作」の置き場が3箇所</div>
      <div style="font-size: var(--fs-xs); color: var(--c-ink-2); line-height: 1.6; margin: 4px 0 14px">同じ役目のボタンが画面ごとに別の場所にある。紺が主要動作。</div>
      <div style="margin-bottom: 16px">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--c-ink-3)">① 右下に浮かせる</div>
        <div style="font-size: var(--fs-xs); color: var(--c-ink-2); line-height: 1.6; margin: 3px 0 6px">リード個体詳細の「計測」</div>
        <div style="position: relative; width: 200px; height: 150px; border-radius: 8px; overflow: hidden; border: 1px solid var(--c-line); background: var(--c-bg)">
          <div style="position: absolute; left: 12px; top: 14px; width: 150px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 30px; width: 120px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 60px; width: 160px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 76px; width: 140px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: var(--r-pill); background: var(--c-accent); color: var(--c-on-accent); font-size: 11px; font-weight: 600">計測</div>
        </div>
      </div>
      <div style="margin-bottom: 16px">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--c-ink-3)">② ヘッダの右</div>
        <div style="font-size: var(--fs-xs); color: var(--c-ink-2); line-height: 1.6; margin: 3px 0 6px">セッション個別詳細の「★目安に設定」「編集」</div>
        <div style="position: relative; width: 200px; height: 150px; border-radius: 8px; overflow: hidden; border: 1px solid var(--c-line); background: var(--c-bg)">
          <div style="position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: var(--r-pill); border: 1px solid var(--c-line-strong); color: var(--c-accent); font-size: 10px; font-weight: 600">★ 目安に設定</div>
          <div style="position: absolute; left: 12px; top: 14px; width: 60px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 46px; width: 150px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 62px; width: 120px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 92px; width: 160px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
        </div>
      </div>
      <div style="margin-bottom: 16px">
        <div style="font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--c-ink-3)">③ 本文の中</div>
        <div style="font-size: var(--fs-xs); color: var(--c-ink-2); line-height: 1.6; margin: 3px 0 6px">人をタップしたときの「目安に設定」</div>
        <div style="position: relative; width: 200px; height: 150px; border-radius: 8px; overflow: hidden; border: 1px solid var(--c-line); background: var(--c-bg)">
          <div style="position: absolute; left: 12px; top: 14px; width: 150px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 30px; width: 120px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 60px; width: 160px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
          <div style="position: absolute; left: 12px; top: 86px; display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: var(--r-pill); background: var(--c-accent); color: var(--c-on-accent); font-size: 11px; font-weight: 600">目安に設定</div>
          <div style="position: absolute; left: 12px; top: 120px; width: 140px; height: 7px; background: var(--c-sunken); border-radius: 4px"></div>
        </div>
      </div>
      <div style="font-size: var(--fs-xs); color: var(--c-ink-2); line-height: 1.6; margin-top: 2px"><b>D8 も同じ形の揺れ</b> ── 保存した後、コミュニティだけ画面を移る(マイページへ)。セッションの編集・リードの評価・目安の設定・人物紹介の目安設定は<b>その場に留まる</b>。</div>
    </div>
</x-dc>
</body>
</html>
