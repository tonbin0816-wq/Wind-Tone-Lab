<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
  body { font-family:"Noto Sans JP", sans-serif; }
  /* トークンは frame.md のまま。新しい色を作らない */
  :root {
    --bg:#FFFFFF; --primary:#174585; --text:#121F32; --muted:#435266; --light:#8D95A1;
    --card-bg:rgba(23,69,133,0.04); --border:rgba(23,69,133,0.20); --rule:#E1E6EC;
    --mid:#7FA0CE; --faint:#B9C9E4; --sunken:#EEF1F4;
    --gold:#C79A3E; --silver:#9BA6B4; --bronze:#A9743E;
  }
  .clip { position:absolute; inset:0; }
  /* 【地は clip の層に置く】#root に background を置くと窓に閉じられ、黒地が出る */
  .ground { background:var(--bg); }
  .pad { padding:0 96px; }
  .num { font-family:"Instrument Serif", serif; }
  .jp { font-family:"Noto Sans JP", sans-serif; }
  .eyebrow { font-size:30px; letter-spacing:.14em; color:var(--primary); font-weight:600; }
  .h1 { font-size:96px; line-height:1.18; color:var(--text); font-weight:700;
        letter-spacing:-.02em; word-break:auto-phrase; }
  .h2 { font-size:66px; line-height:1.28; color:var(--text); font-weight:700;
        letter-spacing:-.02em; word-break:auto-phrase; }
  .body { font-size:38px; line-height:1.7; color:var(--muted); word-break:auto-phrase; }
  .note { font-size:30px; line-height:1.6; color:var(--light); }
  .card { background:var(--card-bg); border:1.5px solid var(--border); border-radius:14px; }
  /* 下描きであることの印。仕上げでは消える */
  .sketch { outline:2px dashed rgba(23,69,133,.28); outline-offset:6px; }
  .sketch-tag { position:absolute; top:40px; left:96px; font-size:24px; letter-spacing:.12em;
                color:var(--light); font-weight:600; }
</style>
</head>
